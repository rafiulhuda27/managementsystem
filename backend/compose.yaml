
services:
  db:
    image: postgres:17
    container_name: proms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: proms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"

    ports:
      - "5432:5432"

    volumes:
      - proms_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proms"]
      interval: 5s
      timeout: "5s"
      retries: 10

volumes:
  proms_postgres_data:




